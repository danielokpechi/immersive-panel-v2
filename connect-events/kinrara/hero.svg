    <radialGradient id="flood" cx=".5" cy=".18" r=".7"><stop offset="0" stop-color="#FFB547" stop-opacity=".32"/><stop offset="1" stop-color="#FFB547" stop-opacity="0"/></radialGradient>
    <linearGradient id="track" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#161A22"/><stop offset="1" stop-color="#07080B"/></linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F4F1EA"/><stop offset=".55" stop-color="#C9C6BF"/><stop offset="1" stop-color="#6F6D69"/></linearGradient>
    <linearGradient id="stripe" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF5A1F"/><stop offset="1" stop-color="#FFB547"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2B3550"/><stop offset="1" stop-color="#0B0F1A"/></linearGradient>
