    <radialGradient id="tyre" cx=".5" cy=".5" r=".5"><stop offset=".55" stop-color="#2A2D33"/><stop offset=".62" stop-color="#0A0B0D"/><stop offset="1" stop-color="#050506"/></radialGradient>
